name: Windows probe

on:
  push:
    branches: [windows-probe]

jobs:
  v1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pkg/sftp
          ref: master

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        shell: bash
        run: |
          set +e
          for flags in "" "-integration" "-testserver" "-integration -testserver"; do
            echo "::group::go test $flags"
            go test -count=1 -timeout 10m -v $flags . > "out$(echo $flags | tr -d ' -').log" 2>&1
            echo "exit $?"
            grep -E '^(--- FAIL|FAIL|ok|panic)' "out$(echo $flags | tr -d ' -').log" | head -100
            echo "::endgroup::"
          done
          echo "== failing tests per mode"
          for f in out*.log; do echo "-- $f"; grep -E -A3 -- '--- FAIL' "$f" | head -200; done

  v2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pkg/sftp
          ref: dev-v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        shell: bash
        run: |
          set +e
          go test -count=1 -timeout 10m ./... 2>&1 | tail -20
          cd localfs
          for flags in "-testserver=true" "-testserver=false"; do
            echo "== localfs $flags"
            go test -count=1 -timeout 10m -v -tags=integration,sftp.sync.metrics $flags . > out.log 2>&1
            echo "exit $?"
            grep -E -A3 -- '^(--- FAIL|FAIL|ok|panic)' out.log | head -200
          done
