name: Windows probe

on:
  push:
    branches: [windows-probe]

jobs:
  v2-windows-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: christhomas/sftp
          ref: v2-windows-ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        shell: bash
        run: |
          go test -v -tags=integration,sftp.sync.metrics ./...
          cd localfs
          go test -v -tags=integration,sftp.sync.metrics -testserver=false
